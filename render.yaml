# Render.com — API Laravel AMEN
# Doc: docs/API_RENDER.md
databases:
  - name: amen-mysql
    plan: free
    databaseName: amen
    user: amen

services:
  - type: web
    name: amen-api
    runtime: docker
    dockerfilePath: ./backend-runtime/Dockerfile
    dockerContext: ./backend-runtime
    plan: free
    healthCheckPath: /api/v1/departements
    envVars:
      - key: APP_NAME
        value: Centre Medical AMEN
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        fromService:
          name: amen-api
          type: web
          property: host
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: amen-mysql
          property: host
      - key: DB_PORT
        fromDatabase:
          name: amen-mysql
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: amen-mysql
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: amen-mysql
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: amen-mysql
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: MOBILE_MONEY_MOCK
        value: "true"
      - key: SANCTUM_STATEFUL_DOMAINS
        value: amen-api.onrender.com
